steps:
  # Paso 1: Construir la imagen Docker multi-stage
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ecomshop-content:latest'
      - '.'

  # Paso 2: Subir imagen a Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ecomshop-content:latest'

  # Paso 3: Desplegar en Cloud Run (europe-west1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ecomshop-content'
      - '--image=gcr.io/$PROJECT_ID/ecomshop-content:latest'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--update-env-vars=GOOGLE_CLOUD_PROJECT=ecomshop-marketing-prod,GOOGLE_CLOUD_LOCATION=europe-west1,VERTEX_LOCATION=us-central1,GOOGLE_GENAI_USE_VERTEXAI=true,GCS_BUCKET_NAME=ecomshop-marketing-assets'

images:
  - 'gcr.io/$PROJECT_ID/ecomshop-content:latest'

options:
  logging: CLOUD_LOGGING_ONLY
