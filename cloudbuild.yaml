steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'APP_VERSION=0.1.0'
      - '--build-arg'
      - 'GIT_COMMIT_SHA=$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ecomshop-content:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ecomshop-content:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ecomshop-content:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ecomshop-content:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ecomshop-content'
      - '--image=gcr.io/$PROJECT_ID/ecomshop-content:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--update-env-vars=GOOGLE_CLOUD_PROJECT=ecomshop-marketing-prod,GOOGLE_CLOUD_LOCATION=europe-west1,VERTEX_LOCATION=us-central1,GOOGLE_GENAI_USE_VERTEXAI=true,GCS_BUCKET_NAME=ecomshop-marketing-assets,ANTIGRAVITY_SDK_ENABLED=true'
      - '--update-secrets=FIREBASE_API_KEY=FIREBASE_API_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/ecomshop-content:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ecomshop-content:latest'

options:
  logging: CLOUD_LOGGING_ONLY
